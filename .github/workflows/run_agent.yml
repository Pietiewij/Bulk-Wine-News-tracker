name: Run Wine Tracker Daily

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out repo code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Market News Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python tracker.py

    - name: Run Harvest Shortage Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python harvest_tracker.py

    - name: Commit and push all reports to your web layout
      run: |
        git config --global user.name "Wine Tracker Bot"
        git config --global user.email "bot@github.com"
        touch index.md harvest_report.md
        git add index.md harvest_report.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Daily Market and Harvest Updates" && git push)
